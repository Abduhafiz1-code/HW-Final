<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Fon: chuqur ko'k-binafsha gradient (donolik rangi) -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Oltin gradient (Gresham oltin g'oya) -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <!-- Oq barglar -->
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- Squircle fon -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="#ffffff" opacity="0.06"/>

  <!-- ═══ Kitob: ochiq kitob (o'quv ramzi) ═══ -->
  <g>
    <path d="M256 340 C256 292 200 256 128 256 C116 256 106 265 106 278 L106 372 C106 385 116 394 128 394 C200 394 256 384 256 340 Z" fill="url(#page)"/>
    <path d="M256 340 C256 292 312 256 384 256 C396 256 406 265 406 278 L406 372 C406 385 396 394 384 394 C312 394 256 384 256 340 Z" fill="url(#page)"/>
    <!-- barg soyalari -->
    <path d="M256 340 C256 292 200 256 128 256 C116 256 106 265 106 278 L106 372 C106 385 116 394 128 394 C200 394 256 384 256 340 Z" fill="#4338ca" opacity="0.07"/>
    <!-- O'rtada kichik S — Socrati harfi -->
    <text x="256" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="64" fill="#4338ca" opacity="0.85">S</text>
  </g>

  <!-- ═══ Lampochka: g'oya donoligi (Sokrat o'ylashi) ═══ -->
  <g>
    <!-- Chiroq shisha qismi -->
    <circle cx="256" cy="150" r="66" fill="url(#gold)"/>
    <!-- Ichki filaman: yorqin nur -->
    <circle cx="256" cy="150" r="40" fill="#fef3c7" opacity="0.55"/>
    <path d="M236 150 L248 136 L262 158 L276 142" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Chiroq poyasi -->
    <rect x="230" y="210" width="52" height="22" rx="8" fill="#b45309"/>
    <rect x="238" y="232" width="36" height="14" rx="7" fill="#92400e"/>
    <!-- Nur nurlari: o'ylagan donolik taraladi -->
    <g stroke="#fbbf24" stroke-width="9" stroke-linecap="round" opacity="0.9">
      <line x1="256" y1="56" x2="256" y2="76"/>
      <line x1="168" y1="86" x2="182" y2="102"/>
      <line x1="344" y1="86" x2="330" y2="102"/>
      <line x1="140" y1="160" x2="162" y2="160"/>
      <line x1="372" y1="160" x2="350" y2="160"/>
    </g>
  </g>

  <!-- ═══ Ulash: kitob va lampochka birgalikda bilim manbai ═══ -->
  <!-- Kichik yulduzcha bezaklar -->
  <g fill="#fde68a" opacity="0.95">
    <path d="M148 130 L153 142 L165 147 L153 152 L148 164 L143 152 L131 147 L143 142 Z"/>
    <path d="M372 320 L376 330 L386 334 L376 338 L372 348 L368 338 L358 334 L368 330 Z"/>
  </g>
</svg>
