<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9645ff"/>
      <stop offset="0.55" stop-color="#7e14ff"/>
      <stop offset="1" stop-color="#4a7dff"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1ecff"/>
    </linearGradient>
  </defs>

  <!-- Squircle background -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bg)"/>

  <!-- subtle top highlight -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="#ffffff" opacity="0.06"/>

  <!-- Open book -->
  <g>
    <!-- left page -->
    <path d="M256 318 C256 268 196 230 122 230 C110 230 100 239 100 253 L100 356 C100 370 110 379 122 379 C196 379 256 368 256 318 Z" fill="url(#page)"/>
    <!-- right page -->
    <path d="M256 318 C256 268 316 230 390 230 C402 230 412 239 412 253 L412 356 C412 370 402 379 390 379 C316 379 256 368 256 318 Z" fill="url(#page)"/>
    <!-- page fold shading -->
    <path d="M256 318 C256 268 196 230 122 230 C110 230 100 239 100 253 L100 356 C100 370 110 379 122 379 C196 379 256 368 256 318 Z" fill="#7e14ff" opacity="0.06"/>
    <!-- spine -->
    <rect x="247" y="225" width="18" height="145" rx="9" fill="#e4d8ff"/>
  </g>

  <!-- Graduation cap -->
  <g>
    <path d="M256 118 L368 165 L256 212 L144 165 Z" fill="#ffffff"/>
    <path d="M256 118 L368 165 L256 212 L144 165 Z" fill="#7e14ff" opacity="0.05"/>
    <rect x="222" y="184" width="68" height="26" rx="10" fill="#ffffff"/>
    <!-- tassel -->
    <line x1="368" y1="165" x2="386" y2="220" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="386" cy="230" r="10" fill="#ffd166"/>
  </g>
</svg>
