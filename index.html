		     og:url va JSON-LD'dagi "url" maydonlarini ham yangilang. -->
		<link rel="canonical" href="https://YOUR_DOMAIN/" />
		<meta name="theme-color" content="#7e14ff" />

		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
