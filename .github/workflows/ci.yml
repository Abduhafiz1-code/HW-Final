name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (vue-tsc)
        run: npx vue-tsc -b --force

      - name: Build (vite)
        run: npx vite build
        env:
          # Build uchun soxta qiymatlar yetarli — faqat kompilyatsiya tekshiriladi
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-for-build

      # Kalitlar tasodifan commit qilinmasligi uchun himoya
      - name: Guard — env fayllar commit qilinmasin
        run: |
          if git ls-files | grep -E "^\.env(\.local)?$"; then
            echo "XATO: .env yoki .env.local git'ga qo'shilgan!"
            exit 1
          fi
          echo "OK: env fayllar tracked emas"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
